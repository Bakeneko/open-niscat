name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Literal prefix: when called from the release workflow, github.workflow is the caller's name.
# Only pull requests cancel superseded runs: every commit on main keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/data/pyproject.toml
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - run: make web-install tools-install
      - run: make web
      - run: make lint test
      - run: make vuln
