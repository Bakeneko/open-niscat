# Weekly update pull requests, grouped per ecosystem so that a quiet week stays quiet.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      # Majors come one by one: they are the ones that need a look.
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /tools/data
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node moves from LTS to LTS (24, 26…) deliberately, together with the engines field of web/package.json.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
