# Copy as compose.yaml next to the data folder, adjust if needed, then: docker compose up -d
services:
  open-niscat:
    image: ghcr.io/bakeneko/open-niscat:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
    # Language offered on the home page (en, fr, es or de):
    # environment:
    #   OPEN_NISCAT_DEFAULT_LANG: fr
